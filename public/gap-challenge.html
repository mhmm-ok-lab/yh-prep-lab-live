<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GapChallenge — AON Practice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0e0dc;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #111;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .controls-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .ctrl-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid #d0d0cc;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: #555;
      transition: background 0.1s, border-color 0.1s;
    }

    .ctrl-btn:hover { background: #f0f0ee; }

    .ctrl-btn.active {
      background: #EEEDFE;
      border-color: #7F77DD;
      color: #534AB7;
      font-weight: 500;
    }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .tnum {
      font-size: 28px;
      font-weight: 500;
      color: #111;
      min-width: 48px;
      text-align: center;
    }

    .tnum.warn { color: #996600; }
    .tnum.danger { color: #aa0000; }

    .tbar-wrap {
      flex: 1;
      height: 7px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    .tbar {
      height: 100%;
      background: #7F77DD;
      border-radius: 4px;
      transition: width 0.9s linear, background 0.3s;
    }

    .grid-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    .grid {
      display: grid;
      gap: 4px;
      background: #bbb;
      border: 1px solid #bbb;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      width: 64px;
      height: 64px;
    }

    .cell.empty { background: #f0f0f0; }

    .cell.qmark { background: #eae6fa; }

    .cell.correct { background: #e6f4e6; }
    .cell.wrong   { background: #fce8e8; }
    .cell.timeout { background: #fdf6e3; }

    .qmark-label {
      font-size: 24px;
      font-weight: 700;
      color: #534AB7;
    }

    .options {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 18px 0 10px;
    }

    .opt {
      width: 62px;
      height: 62px;
      border: 2px solid #ccc;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: border-color 0.1s, background 0.1s;
    }

    .opt:hover {
      border-color: #7F77DD;
      background: #f0eeff;
    }

    .opt.locked   { opacity: 0.35; pointer-events: none; }
    .opt.inactive { opacity: 0.28; pointer-events: none; }

    .feedback {
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      min-height: 22px;
      margin: 6px 0;
    }

    .feedback.ok   { color: #2a7a2a; }
    .feedback.bad  { color: #aa0000; }
    .feedback.out  { color: #996600; }
    .feedback.hint { color: #666; font-weight: 400; font-size: 13px; }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    .btn-main {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #7F77DD;
      background: #EEEDFE;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      color: #534AB7;
      transition: background 0.1s;
    }

    .btn-main:hover { background: #CECBF6; }

    .btn-sec {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #d0d0cc;
      background: #fff;
      font-size: 15px;
      cursor: pointer;
      color: #333;
      transition: background 0.1s;
    }

    .btn-sec:hover { background: #f5f5f3; }

    .stats {
      display: flex;
      gap: 0;
      justify-content: center;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }

    .stat {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #888;
    }

    .stat span {
      display: block;
      font-size: 20px;
      font-weight: 500;
      color: #111;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>GapChallenge <span style="font-size:14px;font-weight:400;color:#888;margin-left:6px;">Symbol Sudoku · Latin Square</span></h1>
  <p class="subtitle">Tränar <strong>Deductive-logical Thinking</strong> — samma format som Aon MapTQ (lst). Ingen form upprepas i samma rad eller kolumn. Hitta formen som hör hemma i <strong>?</strong>-rutan. Tryck <strong>Start / Nästa</strong> för att starta timern.</p>

  <div class="controls-group">
    <button class="ctrl-btn active" id="n4" onclick="setSize(4)">4×4</button>
    <button class="ctrl-btn" id="n5" onclick="setSize(5)">5×5</button>
  </div>

  <div class="controls-group">
    <button class="ctrl-btn active" id="dhard" onclick="setDiff('hard')">Hard (~50% tomma)</button>
    <button class="ctrl-btn" id="dbrutal" onclick="setDiff('brutal')">Brutal (~65% tomma)</button>
  </div>

  <div class="controls-group">
    <button class="ctrl-btn active" id="t36" onclick="setTime(36)">36 sek</button>
    <button class="ctrl-btn" id="t24" onclick="setTime(24)">24 sek (snabbt)</button>
  </div>

  <div class="timer-row">
    <div class="tnum" id="tnum">—</div>
    <div class="tbar-wrap"><div class="tbar" id="tbar" style="width:0%"></div></div>
  </div>

  <div class="grid-wrap" id="grid-wrap"></div>

  <div class="options" id="options"></div>

  <div class="feedback" id="feedback">&nbsp;</div>

  <div class="action-row">
    <button class="btn-main" onclick="onNext()">Start / Nästa</button>
    <button class="btn-sec" onclick="hint()">Ledtråd</button>
  </div>

  <div class="stats">
    <div class="stat"><span id="sc">0</span>rätt</div>
    <div class="stat"><span id="sw">0</span>fel</div>
    <div class="stat"><span id="st">0</span>timeout</div>
    <div class="stat"><span id="sa">—</span>sek/fråga</div>
  </div>
</div>

<script>
  const SHAPES4 = ['circle','square','triangle','cross'];
  const SHAPES5 = ['circle','square','triangle','cross','diamond'];

  function makeSVG(shape, size) {
    const s = size || 36;
    const h = s / 2;
    const d = {
      circle:   `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${h}" cy="${h}" r="${h*0.72}" fill="#111"/></svg>`,
      square:   `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect x="${s*0.14}" y="${s*0.14}" width="${s*0.72}" height="${s*0.72}" fill="#111"/></svg>`,
      triangle: `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><polygon points="${h},${s*0.1} ${s*0.92},${s*0.9} ${s*0.08},${s*0.9}" fill="#111"/></svg>`,
      cross:    `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect x="${s*0.38}" y="${s*0.1}" width="${s*0.24}" height="${s*0.8}" fill="#111"/><rect x="${s*0.1}" y="${s*0.38}" width="${s*0.8}" height="${s*0.24}" fill="#111"/></svg>`,
      diamond:  `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><polygon points="${h},${s*0.07} ${s*0.93},${h} ${h},${s*0.93} ${s*0.07},${h}" fill="#111"/></svg>`
    };
    return d[shape] || '';
  }

  let N = 4, diff = 'hard', timeLimit = 36;
  let puzzle = [], sol = null, qr = 0, qc = 0;
  let active = false, done = false;
  let correctC = 0, wrongC = 0, timeoutC = 0, times = [];
  let timerInterval = null, startTime = 0, remaining = 0;

  function shapes() { return N === 4 ? SHAPES4 : SHAPES5; }

  function setSize(n) {
    N = n;
    ['n4','n5'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('n' + n).classList.add('active');
    buildPuzzle(); renderGrid(); renderOptions(false); resetTimer();
  }

  function setDiff(d) {
    diff = d;
    ['dhard','dbrutal'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('d' + d).classList.add('active');
  }

  function setTime(t) {
    timeLimit = t;
    ['t36','t24'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('t' + t).classList.add('active');
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildPuzzle() {
    const s = [...shapes()]; shuffle(s);
    const off = Array.from({length: N}, (_, i) => i); shuffle(off);
    const g = off.map(o => Array.from({length: N}, (_, c) => s[(o + c) % N]));
    puzzle = g.map(r => [...r]);
    qr = Math.floor(Math.random() * N);
    qc = Math.floor(Math.random() * N);
    sol = puzzle[qr][qc];
    const hideCount = diff === 'brutal' ? Math.floor(N*N*0.65) : Math.floor(N*N*0.5);
    const pos = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!(r === qr && c === qc)) pos.push([r, c]);
    shuffle(pos);
    pos.slice(0, hideCount - 1).forEach(([r, c]) => puzzle[r][c] = null);
    puzzle[qr][qc] = '?';
  }

  function renderGrid() {
    const wrap = document.getElementById('grid-wrap');
    const g = document.createElement('div');
    g.className = 'grid';
    g.style.gridTemplateColumns = `repeat(${N}, 64px)`;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      const v = puzzle[r][c];
      if (v === '?')       { cell.className = 'cell qmark'; cell.id = 'qcell'; cell.innerHTML = '<span class="qmark-label">?</span>'; }
      else if (v === null) { cell.className = 'cell empty'; }
      else                 { cell.className = 'cell'; cell.innerHTML = makeSVG(v, 36); }
      g.appendChild(cell);
    }
    wrap.innerHTML = ''; wrap.appendChild(g);
  }

  function renderOptions(enabled) {
    const shuffled = [...shapes()]; shuffle(shuffled);
    const el = document.getElementById('options'); el.innerHTML = '';
    shuffled.forEach(s => {
      const b = document.createElement('div');
      b.className = 'opt' + (enabled ? '' : ' inactive');
      b.innerHTML = makeSVG(s, 36);
      b.onclick = () => pick(s);
      el.appendChild(b);
    });
  }

  function resetTimer() {
    clearInterval(timerInterval); active = false;
    document.getElementById('tnum').textContent = '—';
    document.getElementById('tnum').className = 'tnum';
    document.getElementById('tbar').style.width = '0%';
  }

  function onNext() {
    clearInterval(timerInterval);
    done = false; active = true;
    document.getElementById('feedback').innerHTML = '&nbsp;';
    document.getElementById('feedback').className = 'feedback';
    buildPuzzle(); renderGrid(); renderOptions(true); beginTimer();
  }

  function beginTimer() {
    remaining = timeLimit; startTime = Date.now(); updateTimerUI();
    timerInterval = setInterval(() => {
      remaining = timeLimit - Math.floor((Date.now() - startTime) / 1000);
      if (remaining <= 0) { clearInterval(timerInterval); onTimeout(); }
      else updateTimerUI();
    }, 500);
  }

  function updateTimerUI() {
    const r = Math.max(0, remaining);
    const el = document.getElementById('tnum');
    el.textContent = r;
    el.className = 'tnum' + (r <= 8 ? ' danger' : r <= 15 ? ' warn' : '');
    document.getElementById('tbar').style.width = (r / timeLimit * 100) + '%';
    document.getElementById('tbar').style.background = r <= 8 ? '#cc2222' : r <= 15 ? '#cc8800' : '#7F77DD';
  }

  function onTimeout() {
    if (done) return; done = true; active = false; timeoutC++;
    lockOptions();
    const qcell = document.getElementById('qcell');
    qcell.innerHTML = makeSVG(sol, 36); qcell.className = 'cell timeout';
    document.getElementById('feedback').textContent = 'Timeout! Svaret var ' + sol;
    document.getElementById('feedback').className = 'feedback out';
    updateStats();
  }

  function pick(s) {
    if (done || !active) return;
    clearInterval(timerInterval); done = true; active = false;
    const elapsed = Math.round((Date.now() - startTime) / 1000);
    times.push(elapsed); lockOptions();
    const qcell = document.getElementById('qcell');
    qcell.innerHTML = makeSVG(sol, 36);
    const fb = document.getElementById('feedback');
    if (s === sol) {
      correctC++; fb.textContent = 'Rätt! ' + sol + ' (' + elapsed + 's)'; fb.className = 'feedback ok'; qcell.className = 'cell correct';
    } else {
      wrongC++; fb.textContent = 'Fel — svaret var ' + sol + ' (' + elapsed + 's)'; fb.className = 'feedback bad'; qcell.className = 'cell wrong';
    }
    updateStats();
  }

  function lockOptions() {
    document.querySelectorAll('.opt').forEach(b => b.classList.add('locked'));
  }

  function hint() {
    if (!active) return;
    const sh = shapes();
    const rowHas = puzzle[qr].filter(v => v && v !== '?');
    const colHas = puzzle.map(r => r[qc]).filter(v => v && v !== '?');
    const rMiss = sh.filter(s => !rowHas.includes(s)).join(', ');
    const cMiss = sh.filter(s => !colHas.includes(s)).join(', ');
    document.getElementById('feedback').textContent = 'Rad saknar: ' + rMiss + ' · Kolumn saknar: ' + cMiss;
    document.getElementById('feedback').className = 'feedback hint';
  }

  function updateStats() {
    document.getElementById('sc').textContent = correctC;
    document.getElementById('sw').textContent = wrongC;
    document.getElementById('st').textContent = timeoutC;
    const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) + 's' : '—';
    document.getElementById('sa').textContent = avg;
  }

  buildPuzzle(); renderGrid(); renderOptions(false);
</script>
</body>
</html>
