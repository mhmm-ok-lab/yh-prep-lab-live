<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <script>
      /* Sätt färgläge före första målning så sidan inte blinkar ljus i mörkt läge. */
      (function () {
        var mode = "auto";
        try { mode = localStorage.getItem("yh.color-mode") || "auto"; } catch (e) {}
        var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-scheme", dark ? "dark" : "light");
        var t = document.querySelector('meta[name="theme-color"]');
        if (t && dark) t.setAttribute("content", "#14171a");
        var c = document.querySelector('meta[name="color-scheme"]');
        if (c && mode !== "auto") c.setAttribute("content", mode === "dark" ? "dark" : "light");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml" />
    <title>YH Prep Lab</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
